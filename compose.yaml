services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huertos}
      POSTGRES_USER: ${POSTGRES_USER:-huertos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huertos_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  parcel-service:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-huertos}
      DB_USERNAME: ${POSTGRES_USER:-huertos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-huertos_dev}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
