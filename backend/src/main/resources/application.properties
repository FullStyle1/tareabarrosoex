spring.application.name=parcel-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/huertos}
spring.datasource.username=${DB_USERNAME:huertos}
spring.datasource.password=${DB_PASSWORD:huertos_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=parcel-service
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
